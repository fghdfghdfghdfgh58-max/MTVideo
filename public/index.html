<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MTVideo</title>
<style>
:root{--bg:#f6f2ff;--sf:#fff;--sf2:#ece4ff;--tx:#1a1030;--mu:#6d5f8f;--pr:#8a2be2;--pr2:#c15cff;--bd:#d9ccf5;--gl:0 0 18px rgba(138,43,226,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07030f;--sf:#120a24;--sf2:#1c1038;--tx:#f3ecff;--mu:#a99bd0;--bd:#2f1d57;--gl:0 0 22px rgba(168,85,247,.45)}}
:root[data-theme="dark"]{--bg:#07030f;--sf:#120a24;--sf2:#1c1038;--tx:#f3ecff;--mu:#a99bd0;--bd:#2f1d57;--gl:0 0 22px rgba(168,85,247,.45)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,sans-serif;background-image:radial-gradient(circle at 20% -10%,rgba(168,85,247,.18),transparent 45%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:30}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--sf);border-bottom:1px solid var(--bd);backdrop-filter:blur(10px)}
.logo{font-weight:800;font-size:20px;letter-spacing:1px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap}
.logo i{width:30px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--pr),var(--pr2));box-shadow:var(--gl);display:grid;place-items:center;font-style:normal;color:#fff;font-size:11px}
.search{flex:1;max-width:560px;margin:0 auto;display:flex}
.search input{flex:1;min-width:0;padding:9px 16px;background:var(--bg);border:1px solid var(--bd);border-radius:20px 0 0 20px;outline:none}
.search input:focus{border-color:var(--pr);box-shadow:var(--gl)}
.search button{padding:0 18px;border:1px solid var(--bd);border-left:0;background:var(--sf2);border-radius:0 20px 20px 0;cursor:pointer}
.btn{border:1px solid var(--bd);background:var(--sf2);padding:8px 16px;border-radius:20px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--pr2)}
.pri{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;box-shadow:var(--gl)}
.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.layout{display:flex}
nav{width:200px;padding:12px 8px;position:sticky;top:60px;height:calc(100vh - 60px);flex-shrink:0;overflow:auto}
nav a{display:flex;gap:14px;padding:10px 14px;border-radius:12px;cursor:pointer;margin-bottom:2px}
nav a:hover{background:var(--sf2)}nav a.on{background:var(--sf2);color:var(--pr2);box-shadow:inset 3px 0 var(--pr)}
nav h4{margin:14px 14px 6px;color:var(--mu);font-size:12px;text-transform:uppercase;letter-spacing:1px}
main{flex:1;padding:16px;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:16px;padding-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px 14px}
.card{cursor:pointer}
.th{aspect-ratio:16/9;border-radius:14px;overflow:hidden;position:relative;border:1px solid var(--bd);transition:.2s}
.card:hover .th{box-shadow:var(--gl);border-color:var(--pr2);transform:translateY(-2px)}
.th canvas,.th video{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.75);color:#fff;font-size:12px;padding:2px 6px;border-radius:6px}
.meta{display:flex;gap:10px;margin-top:10px}
.av{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:700;color:#fff}
.meta b{display:block;font-size:15px;line-height:1.3}.meta small,.mu{color:var(--mu);font-size:13px}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px}
.player{aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--bd);box-shadow:var(--gl)}
.player canvas,.player video{width:100%;height:100%;display:block}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:12px 0}
.grow{flex:1}
.pill{display:flex;border:1px solid var(--bd);border-radius:20px;overflow:hidden;background:var(--sf2)}
.pill button{border:0;background:none;padding:8px 14px;cursor:pointer}.pill button+button{border-left:1px solid var(--bd)}.pill button.on{background:var(--pr)}
.cm{display:flex;gap:10px;margin:14px 0}.cm p{margin:2px 0}
.cin{display:flex;gap:10px;margin:16px 0}.cin input{flex:1;background:none;border:0;border-bottom:1px solid var(--bd);outline:none;padding:6px 0}
.side .card{display:flex;gap:10px;margin-bottom:12px}.side .th{width:160px;flex-shrink:0}
.shorts{height:calc(100vh - 80px);overflow-y:scroll;scroll-snap-type:y mandatory;display:flex;flex-direction:column;align-items:center;gap:16px;scrollbar-width:none}
.sh{scroll-snap-align:center;flex-shrink:0;height:calc(100vh - 100px);aspect-ratio:9/16;max-width:100%;position:relative;display:flex;gap:12px;align-items:flex-end}
.sv{height:100%;aspect-ratio:9/16;border-radius:20px;overflow:hidden;position:relative;border:1px solid var(--pr);box-shadow:var(--gl);background:#000}
.sv canvas,.sv video{width:100%;height:100%;object-fit:cover}
.sv .cap{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff}
.rail{display:flex;flex-direction:column;gap:14px;align-items:center}
.rail button{width:48px;height:48px;border-radius:50%;border:1px solid var(--bd);background:var(--sf2);cursor:pointer;font-size:18px}
.rail button.on{background:var(--pr);box-shadow:var(--gl)}.rail small{margin-top:-10px;color:var(--mu)}
.banner{height:130px;border-radius:16px;background:linear-gradient(120deg,var(--pr),#2b0b5e 60%,var(--pr2));box-shadow:var(--gl);margin-bottom:14px}
.live{background:#ff2d75;color:#fff;font-size:12px;font-weight:700;padding:3px 8px;border-radius:6px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.5}}
.chat{height:420px;border:1px solid var(--bd);border-radius:14px;background:var(--sf);display:flex;flex-direction:column}
.chat .ms{flex:1;overflow:auto;padding:10px;font-size:14px}.chat .ms p{margin:0 0 6px}.chat .ms b{color:var(--pr2)}
.bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:50;padding:16px}
.md{background:var(--sf);border:1px solid var(--pr);box-shadow:var(--gl);border-radius:18px;padding:22px;width:min(440px,100%);max-height:90vh;overflow:auto}
.md input,.md select{width:100%;margin:6px 0 12px;padding:10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pr);color:#fff;padding:10px 18px;border-radius:20px;z-index:60}
@media(max-width:900px){.watch{grid-template-columns:1fr}nav{display:none}.logo span{display:none}}
</style></head>
<body>
<header>
<div class="logo" onclick="go('home')"><i>▶</i><span>MTVideo</span></div>
<div class="search"><input id="q" placeholder="Search MTVideo" onkeydown="if(event.key==='Enter')go('home')"><button onclick="go('home')">🔍</button></div>
<button class="btn pri" onclick="upload()">＋ Create</button>
<select id="chsel" class="btn" onchange="setCh(this.value)" style="max-width:130px"></select><span id="acct" class="mu" style="max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span><button class="btn" id="lo" onclick="logout()">Log out</button><button class="btn" onclick="toggleTheme()" title="Theme">◐</button>
</header>
<div class="layout"><nav id="nav"></nav><main id="app"><p class="mu">Loading…</p></main></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=['#8a2be2','#c15cff','#6d28d9','#a855f7','#7c3aed','#d946ef'];
const col=n=>H[[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)%H.length];
const D={channels:[],videos:[],reacts:[],comments:[],subs:[],live:[],chat:[]};
let uid=null,email='',canW=true,last='',view='home',cur=null,stream=null,tm=null,ready=false;
const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
const ago=t=>{const m=Math.floor((Date.now()-t)/6e4);return m<1?'just now':m<60?m+'m ago':m<1440?Math.floor(m/60)+'h ago':Math.floor(m/1440)+'d ago'};
const chOf=id=>D.channels.find(c=>c.id===id)||{name:'Deleted channel',id};
const mine=()=>D.channels.filter(c=>c.owner===uid);
const actId=()=>{let s=null;try{s=localStorage.getItem('mtv_ch_'+uid)}catch(e){}return mine().find(c=>c.id===s)?s:(mine()[0]||{}).id};
const act=()=>D.channels.find(c=>c.id===actId());
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}
function toggleTheme(){const r=document.documentElement;r.dataset.theme=(r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark'?'light':'dark'}




let rq=0;function refresh(){if(!ready||rq)return;rq=requestAnimationFrame(()=>{rq=0;
 if(view==='watch'&&$('#pl')&&$('#pl').dataset.id===cur){wmeta();return}
 if(view==='shorts'&&$('.shorts')){shortRails();return}
 if(view==='live'||view==='liveview'){chatUI();return}
 render()})}
const subbed=c=>D.subs.some(s=>s.id===c+'_'+uid);

function navb(){const n=[['home','🏠','Home'],['shorts','⚡','Shorts'],['subs','📺','Subscriptions'],['live','🔴','Go Live'],['me','👤','Your Channel']];
$('#nav').style.display='';$('#nav').innerHTML=n.map(a=>`<a class="${view===a[0]?'on':''}" onclick="go('${a[0]}')"><span>${a[1]}</span>${a[2]}</a>`).join('')+'<h4>Subscriptions</h4>'+D.subs.filter(s=>s.uid===uid).map(s=>{const c=chOf(s.ch);return `<a onclick="go('ch','${c.id}')"><span class="av" style="width:24px;height:24px;font-size:12px;background:${col(c.name)}">${esc(c.name[0])}</span>${esc(c.name)}</a>`}).join('');
 const m=mine();$('#chsel').innerHTML=m.length?m.map(c=>`<option value="${c.id}" ${c.id===actId()?'selected':''}>${esc(c.name)}</option>`).join(''):'<option>No channel</option>'}
function setCh(v){try{localStorage.setItem('mtv_ch_'+uid,v)}catch(e){}render()}
function go(v,a){if(stream&&v!=='live'&&view==='live')return toast('End your stream first');view=v;cur=a||null;render();scrollTo(0,0)}
const media=(v,ctl)=>`<video src="${esc(v.url)}${ctl?'':'#t=0.5'}" ${ctl?'controls autoplay':'muted preload="metadata"'}></video>`;
function card(v){const c=chOf(v.chId);return `<div class="card" onclick="go('${v.type==='short'?'shorts':'watch'}','${v.id}')"><div class="th">${media(v,0)}<span class="dur">${v.type==='short'?'⚡ ':''}${fmt(v.dur||0)}</span></div><div class="meta"><span class="av" style="background:${col(c.name)}">${esc(c.name[0])}</span><div><b>${esc(v.title)}</b><small>${esc(c.name)} · ${ago(v.ts)}</small></div></div></div>`}
const empty=(t)=>`<div style="text-align:center;padding:60px 10px"><h3>${t}</h3><p class="mu">MTVideo is brand new — be the first to post.</p><button class="btn pri" onclick="upload()">＋ Upload</button></div>`;
function render(){if(!ready)return;navb();const a=$('#app');
 if(view==='home'){const q=$('#q').value.toLowerCase();const l=D.videos.filter(v=>v.type==='video'&&(v.title+chOf(v.chId).name).toLowerCase().includes(q)).sort((x,y)=>y.ts-x.ts);const lv=D.live.filter(x=>Date.now()-x.ts<150000);
 a.innerHTML=(lv.length?`<div class="chips">${lv.map(x=>`<button class="btn" onclick="go('liveview','${x.id}')"><span class="live">LIVE</span> ${esc(x.chName)}: ${esc(x.title)}</button>`).join('')}</div>`:'')+(l.length?`<div class="grid">${l.map(card).join('')}</div>`:empty(q?'No results':'No videos yet'))}
 else if(view==='subs'){const s=D.subs.filter(x=>x.uid===uid).map(x=>x.ch);const l=D.videos.filter(v=>s.includes(v.chId)).sort((x,y)=>y.ts-x.ts);a.innerHTML='<h2>Subscriptions</h2>'+(l.length?`<div class="grid">${l.map(card).join('')}</div>`:'<p class="mu">Subscribe to channels to see their uploads here.</p>')}
 else if(view==='watch'){const v=D.videos.find(x=>x.id===cur);if(!v){a.innerHTML='<p class="mu">Loading… or this video was removed.</p>';return}
  a.innerHTML=`<div class="watch"><div><div class="player" id="pl" data-id="${v.id}">${media(v,1)}</div><div id="wm"></div><h3 id="wc"></h3><div class="cin"><input id="ci" placeholder="Add a comment…" onkeydown="if(event.key==='Enter')comment('${v.id}','ci')"><button class="btn pri" onclick="comment('${v.id}','ci')">Post</button></div><div id="wl"></div></div><div class="side">${D.videos.filter(x=>x.type==='video'&&x.id!==v.id).slice(0,6).map(x=>`<div class="card" onclick="go('watch','${x.id}')"><div class="th">${media(x,0)}</div><div><b style="font-size:14px">${esc(x.title)}</b><br><small class="mu">${esc(chOf(x.chId).name)}</small></div></div>`).join('')}</div></div>`;wmeta()}
 else if(view==='shorts'){const l=D.videos.filter(v=>v.type==='short').sort((x,y)=>(y.id===cur)-(x.id===cur)||y.ts-x.ts);
  a.innerHTML=l.length?`<div class="shorts">${l.map(v=>`<div class="sh"><div class="sv"><video src="${esc(v.url)}" muted loop autoplay playsinline onclick="this.muted=!this.muted"></video><div class="cap" data-c="${v.id}"></div></div><div class="rail" data-r="${v.id}"></div></div>`).join('')}</div>`:empty('No shorts yet');shortRails()}
 else if(view==='ch'||view==='me'){const c=view==='me'?act():chOf(cur);if(!c||!c.name){a.innerHTML=`<h2>Your Channel</h2><p class="mu">Create a channel to upload videos and shorts. You can have up to 2 channels per email.</p><button class="btn pri" onclick="mkChannel()">Create channel</button>`;return}
  const l=D.videos.filter(v=>v.chId===c.id).sort((x,y)=>y.ts-x.ts),own=c.owner===uid,n=D.subs.filter(s=>s.ch===c.id).length;
  a.innerHTML=`<div class="banner"></div><div class="row"><span class="av" style="width:72px;height:72px;font-size:28px;background:${col(c.name)}">${esc(c.name[0])}</span><div class="grow"><h2 style="margin:0">${esc(c.name)}</h2><span class="mu">${n} subscribers · ${l.length} uploads</span></div>${own?`<button class="btn" onclick="mkChannel()">＋ New channel (${mine().length}/2)</button>`:`<button class="btn ${subbed(c.id)?'':'pri'}" onclick="toggleSub('${c.id}')">${subbed(c.id)?'✓ Subscribed':'Subscribe'}</button>`}</div><div class="grid">${l.map(v=>own?card(v).replace('<div class="meta">',`<div class="meta"><button class="btn" style="padding:2px 10px" onclick="event.stopPropagation();del('${v.id}')">🗑</button>`):card(v)).join('')||'<p class="mu">No uploads yet.</p>'}</div>`}
 else if(view==='live'||view==='liveview')liveUI(a);
}
function counts(id){const r=D.reacts.filter(x=>x.v===id);return{l:r.filter(x=>x.val===1).length,d:r.filter(x=>x.val===-1).length,me:(r.find(x=>x.uid===uid)||{}).val||0}}
function wmeta(){const v=D.videos.find(x=>x.id===cur);if(!v)return;const c=chOf(v.chId),k=counts(v.id),cm=D.comments.filter(x=>x.v===v.id).sort((a,b)=>b.ts-a.ts);
 $('#wm').innerHTML=`<h2 style="margin:14px 0 4px">${esc(v.title)}</h2><div class="mu">${ago(v.ts)}</div><div class="row"><span class="av" style="background:${col(c.name)};cursor:pointer" onclick="go('ch','${c.id}')">${esc(c.name[0])}</span><b class="grow" style="cursor:pointer" onclick="go('ch','${c.id}')">${esc(c.name)}</b><button class="btn ${subbed(c.id)?'':'pri'}" onclick="toggleSub('${c.id}')">${subbed(c.id)?'✓ Subscribed':'Subscribe'}</button><div class="pill"><button class="${k.me===1?'on':''}" onclick="react('${v.id}',1)">👍 ${k.l}</button><button class="${k.me===-1?'on':''}" onclick="react('${v.id}',-1)">👎 ${k.d}</button></div><button class="btn" onclick="share('${v.id}')">↗ Share</button></div>`;
 $('#wc').textContent=cm.length+' Comments';$('#wl').innerHTML=cm.map(cmHtml).join('')}
const cmHtml=c=>`<div class="cm"><span class="av" style="background:${col(c.name)}">${esc((c.name||'?')[0].toUpperCase())}</span><div><b>${esc(c.name)}</b> <small class="mu">${ago(c.ts)}</small><p>${esc(c.text)}</p></div></div>`;
function shortRails(){document.querySelectorAll('[data-r]').forEach(r=>{const id=r.dataset.r,v=D.videos.find(x=>x.id===id);if(!v)return;const k=counts(id),n=D.comments.filter(x=>x.v===id).length;
 r.innerHTML=`<button class="${k.me===1?'on':''}" onclick="react('${id}',1)">👍</button><small>${k.l}</small><button class="${k.me===-1?'on':''}" onclick="react('${id}',-1)">👎</button><small>${k.d}</small><button onclick="cmModal('${id}')">💬</button><small>${n}</small><button onclick="share('${id}')">↗</button>`;
 const c=chOf(v.chId);document.querySelector(`[data-c="${id}"]`).innerHTML=`<b>@${esc(c.name)}</b> <button class="btn ${subbed(c.id)?'':'pri'}" style="padding:2px 10px;margin-left:6px" onclick="toggleSub('${c.id}')">${subbed(c.id)?'Subscribed':'Subscribe'}</button><p style="margin:6px 0 0">${esc(v.title)}</p>`});
 const m=$('#mcl');if(m)m.innerHTML=D.comments.filter(x=>x.v===m.dataset.v).sort((a,b)=>b.ts-a.ts).map(cmHtml).join('')}


function share(id){const u=location.href.split('#')[0]+'#'+id;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast('Link copied'),()=>toast('Share link: '+u))}
function modal(h){const b=document.createElement('div');b.className='bg';b.innerHTML='<div class="md">'+h+'</div>';b.onclick=e=>{if(e.target===b)b.remove()};document.body.appendChild(b);return b}
function cmModal(id){modal(`<h3>Comments</h3><div class="cin"><input id="mci" placeholder="Add a comment…" onkeydown="if(event.key==='Enter')comment('${id}','mci')"><button class="btn pri" onclick="comment('${id}','mci')">Post</button></div><div id="mcl" data-v="${id}">${D.comments.filter(x=>x.v===id).sort((a,b)=>b.ts-a.ts).map(cmHtml).join('')}</div><button class="btn" onclick="this.closest('.bg').remove()">Close</button>`)}



function liveUI(a){const host=view==='live',id=host?uid:cur,l=D.live.find(x=>x.id===id);
 if(host&&!act()){a.innerHTML='<h2>Go Live</h2><p class="mu">Create a channel first.</p><button class="btn pri" onclick="mkChannel()">Create channel</button>';return}
 a.innerHTML=`<h2>${host?'Go Live':'Live: '+esc(l?l.title:'stream ended')}</h2><div class="watch"><div><div class="player" id="lp" style="display:grid;place-items:center;color:#fff">${host?'<span class="mu">Camera preview appears here</span>':'<span style="padding:20px;text-align:center">Chat is live. Video relay to viewers isn’t available on this platform yet.</span>'}</div>${host?`<div class="row"><span id="lb" class="mu">Offline</span><span class="grow"></span><input id="lt" placeholder="Stream title" style="padding:8px;background:var(--bg);border:1px solid var(--bd);border-radius:10px"><button class="btn pri" id="lg" onclick="goLive()">● Go live</button></div>`:''}</div>
 <div class="chat"><div class="ms" id="cmx"></div><div class="cin" style="margin:8px"><input id="cx" placeholder="Say something…" onkeydown="if(event.key==='Enter')say('${id}')"><button class="btn" onclick="say('${id}')">Send</button></div></div></div>`;
 if(stream&&host){const v=document.createElement('video');v.srcObject=stream;v.muted=true;v.autoplay=true;v.playsInline=true;v.style.width='100%';$('#lp').innerHTML='';$('#lp').appendChild(v);$('#lg').textContent='■ End stream'}chatUI()}
function chatUI(){const c=$('#cmx');if(!c)return;const id=view==='live'?uid:cur;c.innerHTML=D.chat.filter(x=>x.live===id).sort((a,b)=>a.ts-b.ts).slice(-60).map(x=>`<p><b>${esc(x.name)}</b> ${esc(x.text)}</p>`).join('')||'<p class="mu">No messages yet.</p>';c.scrollTop=1e9;const b=$('#lb');if(b&&stream)b.innerHTML='<span class="live">LIVE</span> on air'}


const api=async(m,u,b)=>{const h={'X-MTV':'1'};if(b&&!(b instanceof Blob))h['Content-Type']='application/json';if(b instanceof Blob)h['Content-Type']=b.type||'video/mp4';
 const r=await fetch(u,{method:m,headers:h,body:b?(b instanceof Blob?b:JSON.stringify(b)):undefined,credentials:'same-origin'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j};
async function poll(){try{const st=await api('GET','/api/state'),k=JSON.stringify(st);if(k===last)return;last=k;Object.assign(D,st);refresh()}catch(e){if(/log in/i.test(e.message))location.reload()}}
async function write(p){try{await p;await poll()}catch(e){toast(e.message)}}
function gate(){$('#nav').style.display='none';$('#acct').textContent='';$('#chsel').style.display='none';$('#lo').style.display='none';
 $('#app').innerHTML=`<div class="md" style="margin:6vh auto"><div class="logo" style="justify-content:center;font-size:28px"><i>▶</i>MTVideo</div><h3 style="text-align:center">Log in or create an account</h3><input id="ge" type="email" placeholder="Email" autocomplete="email"><input id="gp" type="password" placeholder="Password (8+ characters)" autocomplete="current-password" onkeydown="if(event.key==='Enter')auth('login')"><div class="row"><button class="btn pri grow" onclick="auth('login')">Log in</button><button class="btn grow" onclick="auth('signup')">Sign up</button></div></div>`}
async function auth(k){try{await api('POST','/api/'+k,{email:$('#ge').value,password:$('#gp').value});location.reload()}catch(e){toast(e.message)}}
async function logout(){await api('POST','/api/logout').catch(()=>{});location.reload()}
async function init(){let me=null;try{me=await api('GET','/api/me')}catch(e){}
 if(!me||!me.user)return gate();uid=me.user.id;email=me.user.email;$('#acct').textContent=email;await poll();setInterval(poll,3000);
 setInterval(()=>{if(stream)api('POST','/api/live/ping').catch(()=>{})},60000);
 const h=location.hash.slice(1);if(h)cur=h,view='watch';ready=true;render()}
function toggleSub(c){if(chOf(c).owner===uid)return toast('That’s your own channel');write(api('POST','/api/sub',{channel:c}))}
function react(id,val){write(api('POST','/api/react',{video:id,val:counts(id).me===val?0:val}))}
function comment(id,inp){const i=document.getElementById(inp),t=i.value.trim();if(!t)return;if(!act())return toast('Create a channel to comment'),mkChannel();i.value='';write(api('POST','/api/comment',{video:id,channel:act().id,text:t}))}
function mkChannel(then){if(mine().length>=2)return toast('Limit reached: 2 channels per email');
 const m=modal(`<h3>Create channel</h3><p class="mu">Signed in as ${esc(email)} · ${mine().length}/2 channels used</p><input id="cn" maxlength="24" placeholder="Channel name"><button class="btn pri" id="cb">Create</button>`);
 m.querySelector('#cb').onclick=async()=>{const n=m.querySelector('#cn').value.trim();if(!n)return;
  try{const r=await api('POST','/api/channels',{name:n});try{localStorage.setItem('mtv_ch_'+uid,r.id)}catch(e){}await poll();m.remove();toast('Channel created');then?then():go('me')}catch(e){toast(e.message)}}}
function upload(){if(!act())return mkChannel(upload);
 const m=modal(`<h3>Upload to ${esc(act().name)}</h3><label class="mu">Video file (MP4, WebM or MOV)</label><input type="file" id="uf" accept="video/mp4,video/webm,video/quicktime"><label class="mu">Title</label><input id="ut" maxlength="80"><label class="mu">Type</label><select id="uy"><option value="video">Video</option><option value="short">Short (max 3 min)</option></select><button class="btn pri" id="ub">Publish</button>`);
 m.querySelector('#ub').onclick=()=>{const f=m.querySelector('#uf').files[0],t=m.querySelector('#ut').value.trim()||'Untitled',ty=m.querySelector('#uy').value,b=m.querySelector('#ub');if(!f)return toast('Choose a video file');
  const p=document.createElement('video');p.preload='metadata';p.src=URL.createObjectURL(f);p.onerror=()=>toast('Could not read that file');
  p.onloadedmetadata=async()=>{const d=Math.round(p.duration)||0;if(ty==='short'&&d>180)return toast('Shorts must be 3 minutes or less');
   b.disabled=true;b.textContent='Uploading…';try{await api('POST','/api/upload?'+new URLSearchParams({title:t,type:ty,dur:d,channel:act().id}),f);await poll();m.remove();toast('Published!');go(ty==='short'?'shorts':'home')}catch(e){b.disabled=false;b.textContent='Publish';toast(e.message)}}}}
function del(id){if(confirm('Delete this video?'))write(api('DELETE','/api/videos/'+id))}
function say(id){const i=$('#cx'),t=i.value.trim();if(!t)return;if(!act())return mkChannel();i.value='';write(api('POST','/api/chat',{live:id,channel:act().id,text:t}))}
async function goLive(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;await write(api('DELETE','/api/live'));toast('Stream ended');return render()}
 try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true})}catch(e){return toast('Camera or microphone unavailable (needs HTTPS)')}
 await write(api('POST','/api/live',{title:$('#lt').value.trim()||'Live now',channel:act().id}));render()}
init();
</script></body></html>
